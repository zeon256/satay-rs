id: no-inline-modules
valid:
  - 'pub mod serde_string { pub fn serialize() {} }'
  - '#[cfg(test)] mod tests;'
  - '#[cfg(feature = "test-support")] mod support { fn helper() {} }'
  - '#[cfg(not(test))] mod production { fn helper() {} }'
  - '#[cfg(all(not(test), feature = "json"))] mod production { fn helper() {} }'
invalid:
  - '#[cfg(test)] mod tests { #[test] fn catches() {} }'
  - '#[cfg(test)] mod tests { fn helper() {} }'
  - '#[cfg(test)] mod tests { proptest! { fn generated() {} } }'
  - '#[cfg(all(test, feature = "json"))] mod tests { fn helper() {} }'
  - '#[cfg(all(test, not(feature = "json")))] mod tests { fn helper() {} }'
  - '#[cfg(any(feature = "test-support", test))] mod tests { fn helper() {} }'
  - |
    mod checks {
        #[tokio::test]
        async fn catches_async() {}
    }
