id: no-inline-modules
language: rust
severity: error
message: Inline test module bodies are not allowed; preserve the module's attributes and visibility, move its body to the Rust-resolved standalone module file, and replace `{ ... }` with `;`.
note: >-
  Scoped to inline modules whose body registers a test function (`#[test]`-family attribute),
  matching the repository convention that test code lives in standalone test files while
  production modules (e.g. the serde adapters in satay-runtime) remain inline.
ignores:
  - crates/satay-oas3/**
utils:
  test-attribute:
    kind: attribute_item
    has:
      kind: attribute
      stopBy: neighbor
      any:
        - has:
            kind: identifier
            regex: '^(?:r#)?(?:test|rstest|test_case|parameterized|test_with|wasm_bindgen_test|quickcheck|proptest|test_matrix|test_each_path)$'
            stopBy: neighbor
        - has:
            kind: scoped_identifier
            stopBy: neighbor
            has:
              kind: identifier
              field: name
              regex: '^(?:r#)?(?:test|rstest|test_case|parameterized|test_with|wasm_bindgen_test|quickcheck|proptest|test_matrix|test_each_path)$'
              stopBy: neighbor
rule:
  kind: mod_item
  has:
    kind: declaration_list
    stopBy: neighbor
    has:
      matches: test-attribute
      stopBy: neighbor
