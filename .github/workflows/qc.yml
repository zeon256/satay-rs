name: Quality Checks

on:
  merge_group:
  pull_request:

permissions:
  contents: read

env:
  # sccache cannot cache incremental compilation artifacts
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  changes:
    name: Detect Affected Packages
    runs-on: ubuntu-latest
    outputs:
      format_packages: ${{ steps.affected.outputs.format_packages }}
      packages: ${{ steps.affected.outputs.packages }}
      satay_packages: ${{ steps.affected.outputs.satay_packages }}
      fork_support_packages: ${{ steps.affected.outputs.fork_support_packages }}
      has_packages: ${{ steps.affected.outputs.has_packages }}
      has_satay_packages: ${{ steps.affected.outputs.has_satay_packages }}
      has_oas3_parser: ${{ steps.affected.outputs.has_oas3_parser }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Detect affected packages
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail

          affected="$(bash .github/scripts/affected-packages.sh "$BASE_SHA" "$HEAD_SHA")"
          echo "$affected" | jq .

          {
            echo "format_packages=$(jq -c '.format_packages' <<<"$affected")"
            echo "packages=$(jq -c '.packages' <<<"$affected")"
            echo "satay_packages=$(jq -c '.satay_packages' <<<"$affected")"
            echo "fork_support_packages=$(jq -c '.fork_support_packages' <<<"$affected")"
            echo "has_packages=$(jq -r '.has_packages' <<<"$affected")"
            echo "has_satay_packages=$(jq -r '.has_satay_packages' <<<"$affected")"
            echo "has_oas3_parser=$(jq -r '.has_oas3_parser' <<<"$affected")"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Affected packages"
            jq -r 'if .packages == [] then "Documentation/configuration only" else .packages[] | "- `\(.)`" end' <<<"$affected"
          } >> "$GITHUB_STEP_SUMMARY"

  fmt:
    name: Format Check
    needs: changes
    if: needs.changes.outputs.format_packages != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Format affected packages
        env:
          PACKAGES: ${{ needs.changes.outputs.format_packages }}
          RUSTC_WRAPPER: ""
        run: |
          set -euo pipefail

          package_args=()
          while IFS= read -r package; do
            package_args+=(--package "$package")
          done < <(jq -r '.[]' <<<"$PACKAGES")

          cargo fmt "${package_args[@]}" -- --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      - name: Clippy Satay packages
        if: needs.changes.outputs.has_satay_packages == 'true'
        env:
          PACKAGES: ${{ needs.changes.outputs.satay_packages }}
        run: |
          set -euo pipefail

          package_args=()
          while IFS= read -r package; do
            package_args+=(--package "$package")
          done < <(jq -r '.[]' <<<"$PACKAGES")

          cargo clippy "${package_args[@]}" --all-targets --all-features --no-deps -- -D warnings -D clippy::pedantic -D clippy::perf
      - name: Clippy satay-oas3 parser
        if: needs.changes.outputs.has_oas3_parser == 'true'
        run: cargo clippy --package satay-oas3 --all-targets --all-features --no-deps -- -D warnings
      - name: Clippy upstream support packages
        if: needs.changes.outputs.fork_support_packages != '[]'
        env:
          PACKAGES: ${{ needs.changes.outputs.fork_support_packages }}
        run: |
          set -euo pipefail

          package_args=()
          while IFS= read -r package; do
            package_args+=(--package "$package")
          done < <(jq -r '.[]' <<<"$PACKAGES")

          cargo clippy "${package_args[@]}" --all-targets --all-features

  check:
    name: Compile Check
    needs: changes
    if: needs.changes.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      - name: Compile affected packages
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          set -euo pipefail

          package_args=()
          while IFS= read -r package; do
            package_args+=(--package "$package")
          done < <(jq -r '.[]' <<<"$PACKAGES")

          cargo check "${package_args[@]}" --all-targets --all-features

  dylint:
    name: Dylint
    needs: changes
    if: needs.changes.outputs.has_satay_packages == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-directories: |
            ~/.dylint_drivers
            target/dylint
      # Prebuilt cargo-dylint release binaries cannot build the dylint driver
      # (they bake in a path dependency that only exists on dylint's own CI),
      # so this must compile from source. It runs after the cache restore:
      # warm runs find the binaries in ~/.cargo/bin and skip the build.
      - name: Install cargo-dylint and dylint-link
        run: cargo install --locked cargo-dylint dylint-link
      - name: Install Dylint toolchain components
        run: |
          set -euo pipefail

          cargo dylint list | while read -r _ toolchain _; do
            if [ -n "${toolchain:-}" ]; then
              rustup component add --toolchain "$toolchain" rustfmt
            fi
          done
      - name: Dylint affected packages
        env:
          PACKAGES: ${{ needs.changes.outputs.satay_packages }}
          DYLINT_RUSTFLAGS: "-D warnings"
        run: |
          set -euo pipefail

          package_args=()
          while IFS= read -r package; do
            package_args+=(--package "$package")
          done < <(jq -r '.[]' <<<"$PACKAGES")

          cargo dylint --all --no-deps "${package_args[@]}" -- --tests

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      - name: Test affected packages
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          set -euo pipefail

          package_args=()
          while IFS= read -r package; do
            package_args+=(--package "$package")
          done < <(jq -r '.[]' <<<"$PACKAGES")

          cargo test "${package_args[@]}" --all-features
      - name: Test satay-oas3 without default features
        if: needs.changes.outputs.has_oas3_parser == 'true'
        run: cargo test --package satay-oas3 --no-default-features

  result:
    name: QC Result
    needs: [changes, fmt, clippy, check, dylint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks
        env:
          RESULTS: >-
            ${{ needs.changes.result }}
            ${{ needs.fmt.result }}
            ${{ needs.clippy.result }}
            ${{ needs.check.result }}
            ${{ needs.dylint.result }}
            ${{ needs.test.result }}
        run: |
          set -euo pipefail

          for result in $RESULTS; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Quality check finished with result: $result" >&2
              exit 1
            fi
          done
