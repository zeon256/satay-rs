[package]
name = "satay-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "no_std storage type families for text, contiguous collections, and maps"
repository = "https://github.com/zeon256/satay-rs"
homepage = "https://github.com/zeon256/satay-rs"
documentation = "https://docs.rs/satay-storage"

[features]
default = ["alloc"]
alloc = []

[dev-dependencies]
bumpalo = { version = "3.20", default-features = false, features = ["collections"] }

[lints]
workspace = true

[[example]]
name = "bumpalo"
required-features = ["alloc"]

[[example]]
name = "hash_map"
required-features = ["alloc"]
