[package]
name = "satay-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Generate Rust client code from OpenAPI 3.1 documents"
repository = "https://github.com/zeon256/satay-rs"
homepage = "https://github.com/zeon256/satay-rs"
documentation = "https://docs.rs/satay-codegen"
rust-version.workspace = true

[dependencies]
oas3 = { workspace = true, features = ["preserve-order", "yaml-spec"] }
satay-codegen-rust.workspace = true
satay-ir.workspace = true
serde = { workspace = true }
serde_json.workspace = true
serde-saphyr.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["visit-mut"] }
# Pre-fetch the dependency used by generated crates before their offline resolution.
compact_str = { version = "0.9", features = ["serde"] }
tempfile.workspace = true
